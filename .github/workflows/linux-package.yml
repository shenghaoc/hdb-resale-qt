name: Linux package (native)

# Qt-dependent build, native gates and installed-package verification. The lightweight
# domain.yml stays Qt-free and fast; this workflow runs only when something that can change
# the packaged binary, its contents or its verification changes.
#
# Package binaries are never uploaded: CI proves they install and run, which is not a
# distribution clearance (docs/product-rc/licensing-packaging.md). Only verification
# reports, manifests and checksums are retained.
on:
  push:
    branches: [main]
    paths:
      - "src/**"                       # app/native source, QML, resources, project and Qt Bridge pins
      - "tests/fixtures/worker-api/**" # recorded API the package smoke runs against
      - "tools/package/**"
      - "tools/api_fixture_server.py"
      - "tools/api_native_smoke.py"
      - "tools/test_package_*.py"
      - "packaging/**"
      - "global.json"
      - "Directory.Build.props"
      - "HdbResale.slnx"
      - "LICENSE"                      # the next entries are copied into the package's licenses/
      - "LICENSES/**"
      - "REUSE.toml"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/product-rc/licensing-packaging.md"
      - ".github/workflows/linux-package.yml"
  pull_request:
    paths:
      - "src/**"                       # app/native source, QML, resources, project and Qt Bridge pins
      - "tests/fixtures/worker-api/**" # recorded API the package smoke runs against
      - "tools/package/**"
      - "tools/api_fixture_server.py"
      - "tools/api_native_smoke.py"
      - "tools/test_package_*.py"
      - "packaging/**"
      - "global.json"
      - "Directory.Build.props"
      - "HdbResale.slnx"
      - "LICENSE"                      # the next entries are copied into the package's licenses/
      - "LICENSES/**"
      - "REUSE.toml"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/product-rc/licensing-packaging.md"
      - ".github/workflows/linux-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.ref }}
  cancel-in-progress: true

env:
  # Verified toolchain. A change here is a deliberate native re-validation, not a routine bump.
  QT_VERSION: "6.12.0"
  AQT_VERSION: "3.3.0"
  CMAKE_VERSION: "4.4.3"
  NINJA_VERSION: "1.13.2"
  DEBIAN_IMAGE: "debian:13"
  FEDORA_IMAGE: "fedora:43"
  DISPLAY: ":99"

jobs:
  package:
    name: Build, package and verify (Debian 13 DEB, Fedora 43 RPM)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install build and X11 prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential libgl-dev libglx-dev libopengl-dev libegl-dev libxkbcommon-dev libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-glx0 libx11-xcb1 libfontconfig1 libdbus-1-3 libwayland-client0 libwayland-cursor0 \
            libwayland-egl1 libgl1 libegl1 libopengl0 libgl1-mesa-dri \
            rpm xvfb xauth strace desktop-file-utils appstream
      - name: Provision the pinned Qt
        run: |
          python3 -m venv "$RUNNER_TEMP/toolchain"
          "$RUNNER_TEMP/toolchain/bin/pip" install --quiet \
            "aqtinstall==$AQT_VERSION" "ninja==$NINJA_VERSION" "cmake==$CMAKE_VERSION"
          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/toolchain/bin/aqt" install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/Qt" \
            -m qtgraphs qtlocation qtpositioning qtquick3d qtquicktimeline qtshadertools
          echo "QtDir=$HOME/Qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"
      - name: Start a virtual X11 display
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x800x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 2

      # Existing relevant tests first: package only code that passes them.
      - name: C# tests
        run: |
          dotnet build tests/HdbResale.Tests -c Release
          dotnet test tests/HdbResale.Tests -c Release --no-build
      - name: Python tests (includes package unit tests and negative controls)
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build the application (Release)
        run: dotnet build src/HdbResale.App -c Release
      - name: Native gates against the build tree
        run: |
          ctest --test-dir src/HdbResale.App/obj/Release/net10.0/qt/native/build --output-on-failure
          for mode in recorded high-zoom unreachable tile-failure; do
            python3 tools/api_native_smoke.py --executable src/HdbResale.App/bin/Release/net10.0/HdbResale.App \
              --mode "$mode" --log "$RUNNER_TEMP/reports/native-$mode.log"
          done
        env:
          QT_QPA_PLATFORM: xcb

      - name: Stage the runtime
        run: |
          dotnet_root=$(dirname "$(readlink -f "$(command -v dotnet)")")
          python3 tools/package/stage_linux.py --qt "$QtDir" --dotnet "$dotnet_root" \
            --bridge "$HOME/.nuget/packages/qtgroup.qt.bridge.csharp.linux-x64/0.4.0-beta" \
            --output "$RUNNER_TEMP/stage"
          echo "STAGED=$(echo "$RUNNER_TEMP"/stage/hdb-resale-explorer-*-linux-x64)" >> "$GITHUB_ENV"
      - name: Build tar.gz, DEB and RPM from the staged tree
        run: python3 tools/package/build_packages.py --staged "$STAGED" --output "$RUNNER_TEMP/dist"
      - name: Negative control, a modified staged tree must not be packaged
        run: |
          mkdir "$RUNNER_TEMP/tampered"
          cp -a "$STAGED" "$RUNNER_TEMP/tampered/"
          printf 'x' >> "$RUNNER_TEMP/tampered/$(basename "$STAGED")/app/qt.conf"
          if python3 tools/package/build_packages.py --staged "$RUNNER_TEMP/tampered/$(basename "$STAGED")" \
               --output "$RUNNER_TEMP/never" --format tar; then
            echo "::error::a tampered staged tree was packaged"; exit 1
          fi
      - name: Relocated tar smoke on the build host (recorded API, real X11)
        run: |
          mkdir "$RUNNER_TEMP/tar extract"
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/tar extract"
          python3 tools/package/launch_check.py --package "$RUNNER_TEMP"/tar\ extract/hdb-resale-explorer-* \
            --log "$RUNNER_TEMP/reports/tar-launch.log" --report "$RUNNER_TEMP/reports/tar-launch-report.json"

      - name: Install and verify the DEB on Debian 13
        run: |
          docker pull -q "$DEBIAN_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$DEBIAN_IMAGE" | tee "$RUNNER_TEMP/reports/debian-image.txt"
          docker run --rm -v "$RUNNER_TEMP/dist:/pkg:ro" -v "$PWD:/work:ro" -v "$RUNNER_TEMP/reports/deb:/out" \
            "$DEBIAN_IMAGE" sh /work/tools/package/verify_installed.sh deb /pkg/hdb-resale-explorer_*_amd64.deb /work /out
      - name: Install and verify the RPM on Fedora 43
        run: |
          docker pull -q "$FEDORA_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$FEDORA_IMAGE" | tee "$RUNNER_TEMP/reports/fedora-image.txt"
          docker run --rm -v "$RUNNER_TEMP/dist:/pkg:ro" -v "$PWD:/work:ro" -v "$RUNNER_TEMP/reports/rpm:/out" \
            "$FEDORA_IMAGE" sh /work/tools/package/verify_installed.sh rpm /pkg/hdb-resale-explorer-*.x86_64.rpm /work /out

      - name: Collect verification reports (never the package binaries)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/reports/package"
          cp "$RUNNER_TEMP"/dist/{SHA256SUMS,packages.json} "$RUNNER_TEMP/reports/package/" || true
          cp "$STAGED"/{manifest.json,system-libraries.txt} "$RUNNER_TEMP/reports/package/" || true
          dpkg-deb -I "$RUNNER_TEMP"/dist/*.deb > "$RUNNER_TEMP/reports/package/deb-info.txt" || true
          rpm -qpi "$RUNNER_TEMP"/dist/*.rpm > "$RUNNER_TEMP/reports/package/rpm-info.txt" || true
          rpm -qpR "$RUNNER_TEMP"/dist/*.rpm >> "$RUNNER_TEMP/reports/package/rpm-info.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-package-verification
          path: ${{ runner.temp }}/reports
          retention-days: 14
          if-no-files-found: warn
