name: Dependabot configuration
on:
  pull_request:
    paths: [".github/dependabot.yml", ".github/workflows/dependabot-config.yml"]
  push:
    branches: [main]
    paths: [".github/dependabot.yml", ".github/workflows/dependabot-config.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate against the published Dependabot schema
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet check-jsonschema==0.33.3
          "$RUNNER_TEMP/venv/bin/check-jsonschema" --builtin-schema vendor.dependabot .github/dependabot.yml
